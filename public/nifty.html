<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>NIFTY 50 — Live 3D · TradeMind</title>
<meta name="description" content="NIFTY 50 live in 3D — real daily/4H candles rendered as a rotating 3D landscape. Free NSE index data from TradeMind." />
<meta name="theme-color" content="#05070f" />
<link rel="icon" type="image/svg+xml" href="/logo.svg" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<style>
  :root{
    --bg:#05070f; --panel:rgba(13,20,38,.72); --line:rgba(148,163,184,.15);
    --txt:#e9eefb; --dim:#93a1bd; --dim2:#6b7896;
    --up:#22e08a; --down:#ff4d6d; --accent:#4f8cff; --accent2:#8b5cf6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 760px at 78% -14%,#0d2a52 0%,transparent 60%),
               radial-gradient(1000px 700px at -12% 16%,#1b0f43 0%,transparent 58%),
               var(--bg);
    color:var(--txt);
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Ubuntu,"Helvetica Neue",sans-serif;
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  #n3d{position:fixed;inset:0;width:100%;height:100%;display:block}
  .vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 42%,transparent 40%,rgba(0,0,0,.55) 100%)}

  /* top bar */
  .top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:14px;padding:16px 20px;z-index:5}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px}
  .brand img{width:30px;height:30px;filter:drop-shadow(0 6px 16px rgba(79,140,255,.5))}
  .brand b{background:linear-gradient(96deg,#7db1ff,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
  .top .spacer{flex:1}
  .btn{padding:9px 15px;border-radius:11px;font-size:13px;font-weight:650;border:1px solid var(--line);
    background:rgba(148,163,184,.07);color:var(--txt);cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .btn:hover{background:rgba(148,163,184,.14);transform:translateY(-1px)}
  .btn.grad{background:linear-gradient(96deg,#4f8cff,#8b5cf6);border-color:transparent;color:#fff;box-shadow:0 14px 30px -14px rgba(79,140,255,.8)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .seg button{border:0;background:transparent;color:var(--dim);padding:9px 14px;font-size:13px;font-weight:650;cursor:pointer}
  .seg button.active{background:linear-gradient(96deg,#4f8cff,#8b5cf6);color:#fff}

  /* HUD */
  .hud{position:fixed;left:20px;bottom:20px;z-index:5;background:var(--panel);border:1px solid var(--line);
    border-radius:18px;padding:16px 20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 24px 60px -30px rgba(0,0,0,.9);min-width:250px}
  .hud .k{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.8px;
    text-transform:uppercase;color:#9dc0ff}
  .hud .live{width:8px;height:8px;border-radius:50%;background:var(--up);box-shadow:0 0 0 0 rgba(34,224,138,.6);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,224,138,.55)}70%{box-shadow:0 0 0 12px rgba(34,224,138,0)}100%{box-shadow:0 0 0 0 rgba(34,224,138,0)}}
  .hud .price{font-size:40px;font-weight:850;letter-spacing:-1.5px;margin:6px 0 2px;font-variant-numeric:tabular-nums}
  .hud .chg{font-size:15px;font-weight:700}
  .hud .meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--dim2)}
  .hud .meta b{color:var(--dim);font-weight:700}
  .u{color:var(--up)}.d{color:var(--down)}

  .cap{position:fixed;left:20px;top:64px;z-index:5;font-size:12px;color:var(--dim2);max-width:280px;line-height:1.5}
  .cap a{color:#9dc0ff}

  .loading{position:fixed;inset:0;display:grid;place-items:center;z-index:6;text-align:center;color:var(--dim);gap:10px}
  .loading .spin{width:38px;height:38px;border-radius:50%;border:3px solid rgba(148,163,184,.25);border-top-color:var(--accent);animation:sp 1s linear infinite;margin:0 auto 14px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hidden{display:none!important}

  @media(max-width:640px){
    .hud{left:12px;right:12px;bottom:12px;min-width:0}
    .hud .price{font-size:32px}
    .cap{display:none}
    .top{padding:12px}
    .brand span{display:none}
  }
  @media(prefers-reduced-motion:reduce){.hud .live{animation:none}}
</style>
</head>
<body>
<canvas id="n3d"></canvas>
<div class="vignette" aria-hidden="true"></div>

<header class="top">
  <a class="brand" href="/"><img src="/logo.svg" alt="TradeMind" /><b>TradeMind</b><span class="tiny" style="color:var(--dim2)">· NIFTY 3D</span></a>
  <div class="spacer"></div>
  <div class="seg" id="tf-seg">
    <button data-tf="D" class="active">Daily</button>
    <button data-tf="4H">4H</button>
  </div>
  <button class="btn" id="btn-spin" title="Pause / resume rotation">⏸ Pause</button>
  <button class="btn" id="btn-refresh" title="Refresh data">⟳ Refresh</button>
  <a class="btn grad" href="/app/">Open app →</a>
</header>

<div class="cap">
  <b style="color:var(--txt)">NIFTY 50</b> — real candles from Yahoo Finance, drawn as a live rotating 3D landscape.
  Bar height = close, depth = volume, colour = up/down day.
</div>

<div class="loading" id="loading">
  <div><div class="spin"></div>Fetching live NIFTY data…</div>
</div>

<section class="hud">
  <div class="k"><span class="live"></span> NIFTY 50 · <span id="mkt">—</span></div>
  <div class="price" id="px">₹—</div>
  <div class="chg" id="chg">—</div>
  <div class="meta">
    <span>4H RSI <b id="rsi">—</b></span>
    <span>Range <b id="rng">—</b></span>
    <span>Bars <b id="bars">—</b></span>
    <span id="updated">—</span>
  </div>
</section>

<script src="nifty3d.js?v=3"></script>
</body>
</html>
