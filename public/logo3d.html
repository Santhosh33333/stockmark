<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020914">
<meta name="description" content="TradeMind — 3D animated brand mark.">
<title>TradeMind — 3D Animated Logo</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<style>
:root{
  --mint:#00f0b5;
  --cyan:#35d9ff;
  --bg:#020914;
}
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0}
body{
  min-height:100vh;display:grid;place-items:center;overflow:hidden;
  color:#eafffb;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:radial-gradient(ellipse at 50% 42%,#063442 0%,#061526 38%,var(--bg) 76%);
}
.scene{
  position:relative;isolation:isolate;width:min(1000px,100vw);min-height:100vh;
  display:grid;place-items:center;perspective:1200px;overflow:hidden;
}
.grid{
  position:absolute;z-index:-3;inset:-25%;
  background-image:linear-gradient(#1a829122 1px,transparent 1px),
                   linear-gradient(90deg,#1a829122 1px,transparent 1px);
  background-size:42px 42px;opacity:.38;
  transform:perspective(650px) rotateX(62deg) translateY(170px);
  -webkit-mask-image:linear-gradient(transparent,#000 22%,#000 70%,transparent);
  mask-image:linear-gradient(transparent,#000 22%,#000 70%,transparent);
}
.glow{
  position:absolute;z-index:-2;width:min(70vw,650px);aspect-ratio:1;
  border-radius:50%;background:radial-gradient(circle,#00f0b526,#12a9ff0c 42%,transparent 70%);
  filter:blur(20px);animation:breathe 5s ease-in-out infinite;
}
.ring{
  position:absolute;z-index:-1;width:min(66vw,620px);aspect-ratio:1;
  border:1px solid #00f0b52b;border-radius:50%;
  box-shadow:0 0 35px #00f0b50b,inset 0 0 35px #00f0b50a;
  animation:orbit 22s linear infinite;
}
.ring::before,.ring::after{
  content:"";position:absolute;width:7px;height:7px;border-radius:50%;
  background:var(--mint);box-shadow:0 0 18px 4px #00f0b55c;
}
.ring::before{top:12%;left:18%}
.ring::after{right:11%;bottom:22%;background:var(--cyan);box-shadow:0 0 18px 4px #35d9ff66}
/* fixed, responsive size — never overflows the viewport */
.logo-wrap{
  width:min(56vw,560px);max-width:560px;transform-style:preserve-3d;
  animation:levitate 6s ease-in-out infinite;
  transition:filter .35s ease;
  filter:drop-shadow(0 28px 35px #0009);
}
.logo{
  display:block;width:100%;height:auto;aspect-ratio:1/1;border-radius:8px;
  user-select:none;-webkit-user-drag:none;
  transform:translateZ(25px);
  -webkit-mask-image:radial-gradient(ellipse 82% 82% at 50% 49%,#000 74%,transparent 100%);
  mask-image:radial-gradient(ellipse 82% 82% at 50% 49%,#000 74%,transparent 100%);
}
.logo-wrap:hover{filter:drop-shadow(0 30px 44px #00f0b522) brightness(1.06)}
.particle{
  position:absolute;width:4px;height:4px;border-radius:50%;
  background:var(--mint);box-shadow:0 0 13px 3px #00f0b55c;
  animation:drift 5s ease-in-out infinite;
}
.p1{left:13%;top:28%}
.p2{right:15%;top:24%;animation-delay:-2s;background:var(--cyan)}
.p3{left:21%;bottom:21%;animation-delay:-3.4s}
.p4{right:19%;bottom:27%;animation-delay:-1.3s;background:var(--cyan)}
.caption{
  position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
  color:#88a9ba;font-size:10px;letter-spacing:2.4px;text-transform:uppercase;
  white-space:nowrap;text-align:center;
}
.controls{position:absolute;top:20px;right:20px;display:flex;gap:8px}
button{
  border:1px solid #225267;border-radius:10px;padding:10px 13px;
  background:#061a2bcc;color:#eafffb;font:600 12px system-ui,sans-serif;
  cursor:pointer;backdrop-filter:blur(12px);transition:.2s;
}
button:hover{border-color:var(--mint);transform:translateY(-2px)}
button.primary{color:#00231c;background:linear-gradient(110deg,var(--mint),#48ddcb);border-color:transparent}
.paused *{animation-play-state:paused !important}
@keyframes levitate{
  0%,100%{transform:translateY(0) rotateX(0deg) rotateY(-2deg)}
  50%{transform:translateY(-12px) rotateX(1.4deg) rotateY(2deg)}
}
@keyframes orbit{from{transform:rotate(0deg) scaleY(.93)}to{transform:rotate(360deg) scaleY(.93)}}
@keyframes breathe{0%,100%{transform:scale(.92);opacity:.65}50%{transform:scale(1.08);opacity:1}}
@keyframes drift{0%,100%{transform:translate(0,0) scale(.7);opacity:.25}50%{transform:translate(10px,-18px) scale(1.3);opacity:1}}
@media(max-width:600px){
  .logo-wrap{width:min(78vw,360px)}
  .ring{width:78vw}
  .caption{font-size:8px;letter-spacing:1.4px;bottom:18px}
  .controls{top:12px;right:12px}
  button{padding:8px 10px;font-size:11px}
}
/* short viewports: keep the mark fully visible */
@media(max-height:620px){
  .logo-wrap{width:min(42vw,360px)}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<main class="scene" id="scene" aria-label="TradeMind animated logo">
  <div class="grid"></div><div class="glow"></div><div class="ring"></div>
  <span class="particle p1"></span><span class="particle p2"></span>
  <span class="particle p3"></span><span class="particle p4"></span>
  <div class="logo-wrap" id="logoWrap">
    <img class="logo" alt="TradeMind logo: a rising teal arrow and stock candlesticks with the tagline Analyze, Plan, Trade"
      src="/assets/trademind-logo.png" onerror="this.onerror=null;this.src='/logo.svg'">
  </div>
  <div class="controls">
    <button class="primary" id="toggleMotion">Pause animation</button>
    <button id="resetView">Reset view</button>
  </div>
  <div class="caption">TradeMind · Analyze · Plan · Trade</div>
</main>
<script>
(() => {
  const scene = document.getElementById('scene');
  const logoWrap = document.getElementById('logoWrap');
  const toggle = document.getElementById('toggleMotion');
  toggle.addEventListener('click', () => {
    const paused = scene.classList.toggle('paused');
    toggle.textContent = paused ? 'Play animation' : 'Pause animation';
  });
  document.getElementById('resetView').addEventListener('click', () => { logoWrap.style.transform = ''; });
  if (matchMedia('(hover:hover) and (pointer:fine)').matches &&
      !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    scene.addEventListener('pointermove', e => {
      const r = scene.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - .5;
      const y = (e.clientY - r.top) / r.height - .5;
      logoWrap.style.animation = 'none';
      logoWrap.style.transform = `translateY(-3px) rotateX(${-y * 8}deg) rotateY(${x * 12}deg)`;
    });
    scene.addEventListener('pointerleave', () => {
      logoWrap.style.transform = '';
      logoWrap.style.animation = '';
    });
  }
})();
</script>
</body>
</html>
