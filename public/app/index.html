<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>StockArtha — Live NSE &amp; BSE Smart-Money Scanner</title>
<meta name="description" content="Live NSE/BSE stock scanner: wick rejection + order block + inducement signals with 4H RSI filter, paper trading and Dhan Algo execution." />
<meta name="theme-color" content="#040b1a" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="/logo.svg" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<link rel="stylesheet" href="app.css" />
</head>
<body>

<div id="bg-scene" aria-hidden="true">
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="orb orb-c"></div>
  <div class="grid-floor"></div>
</div>

<!-- ══════════ AUTH SCREEN (shown only when signed out) ══════════ -->
<section id="auth-screen" class="screen auth hidden">
  <div class="auth-card tilt">
    <div class="brand-3d">
      <img src="/logo.svg" alt="StockArtha logo" class="logo-3d" />
      <h1 class="brand-title">Stock<span>Artha</span></h1>
    </div>
    <p class="tagline">Live NSE &amp; BSE Smart-Money Scanner</p>

    <div class="auth-tabs">
      <button class="tab active" data-tab="login">Sign in</button>
      <button class="tab" data-tab="signup">Create account</button>
    </div>

    <form id="auth-form" autocomplete="on">
      <label>Email
        <input type="email" name="email" required placeholder="you@email.com" />
      </label>
      <label style="display:none" id="name-field">Name
        <input type="text" name="displayName" placeholder="Your name" />
      </label>
      <label>Password
        <input type="password" name="password" required placeholder="••••••••" minlength="6" />
      </label>
      <p class="auth-error" id="auth-error"></p>
      <button class="btn primary block" type="submit" id="auth-submit">Sign in</button>
      <button class="btn block hidden" id="auth-resend" type="button" style="margin-top:8px">Resend code</button>
    </form>

    <!-- OTP step (email code) -->
    <form id="otp-form" class="hidden" autocomplete="one-time-code">
      <p class="otp-info" id="otp-info">Enter the 6-digit code we emailed you.</p>
      <div class="otp-dev hidden" id="otp-dev"></div>
      <div class="otp-inputs" id="otp-inputs">
        <input maxlength="1" inputmode="numeric" pattern="[0-9]" />
        <input maxlength="1" inputmode="numeric" pattern="[0-9]" />
        <input maxlength="1" inputmode="numeric" pattern="[0-9]" />
        <input maxlength="1" inputmode="numeric" pattern="[0-9]" />
        <input maxlength="1" inputmode="numeric" pattern="[0-9]" />
        <input maxlength="1" inputmode="numeric" pattern="[0-9]" />
      </div>
      <p class="auth-error" id="otp-error"></p>
      <button class="btn primary block" type="submit" id="otp-submit">Verify &amp; continue</button>
      <button class="btn block" type="button" id="otp-resend" style="margin-top:8px">Resend code</button>
    </form>
    <p class="auth-foot">Signals are educational analysis, not investment advice. Indian market data in ₹ (INR).</p>
  </div>
</section>

<!-- ══════════ MAIN APP ══════════ -->
<div id="app" class="hidden">
  <header class="topbar glass">
    <div class="topbar-left">
      <img src="/logo.svg" class="topbar-logo" alt="" />
      <div>
        <div class="app-name">StockArtha</div>
        <div class="market-pill" id="market-pill"><span class="dot"></span><span id="market-text">—</span></div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="btn-alerts" title="Alerts">🔔<span class="badge hidden" id="alert-badge"></span></button>
      <button class="icon-btn" id="btn-logout" title="Sign out">⏻</button>
    </div>
  </header>

  <div class="ticker-wrap">
    <div class="ticker" id="index-ticker"></div>
  </div>

  <main id="view" class="view"></main>

  <nav class="bottomnav glass">
    <button class="navbtn active" data-route="dashboard"><span>📊</span>Home</button>
    <button class="navbtn" data-route="scanner"><span>🔎</span>Scan</button>
    <button class="navbtn" data-route="paper"><span>💼</span>Paper</button>
    <button class="navbtn" data-route="alerts"><span>🔔</span>Alerts</button>
    <button class="navbtn" data-route="settings"><span>⚙️</span>Settings</button>
  </nav>
</div>

<div id="toast-wrap"></div>
<script src="chart.js"></script>
<script src="app.js"></script>
</body>
</html>
