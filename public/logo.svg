<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061a2b"/>
      <stop offset=".5" stop-color="#04101f"/>
      <stop offset="1" stop-color="#03131d"/>
    </linearGradient>
    <linearGradient id="ringG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f0b5"/>
      <stop offset="1" stop-color="#29cfff"/>
    </linearGradient>
    <linearGradient id="lineG" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00b98a"/>
      <stop offset="1" stop-color="#5cf0d0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgG)"/>
  <rect x="30" y="30" width="452" height="452" rx="92" fill="none" stroke="url(#ringG)" stroke-width="3" opacity=".55"/>
  <!-- candlesticks -->
  <g opacity=".45" stroke="#0f7f8f" stroke-width="10" stroke-linecap="round">
    <line x1="150" y1="300" x2="150" y2="360"/>
    <line x1="216" y1="266" x2="216" y2="340"/>
    <line x1="282" y1="232" x2="282" y2="312"/>
    <line x1="348" y1="196" x2="348" y2="276"/>
  </g>
  <g fill="#0f8f8f" opacity=".5">
    <rect x="140" y="316" width="20" height="34" rx="4"/>
    <rect x="206" y="284" width="20" height="44" rx="4"/>
    <rect x="272" y="250" width="20" height="52" rx="4"/>
    <rect x="338" y="212" width="20" height="54" rx="4"/>
  </g>
  <!-- upward structure line -->
  <path d="M120 356 L200 300 L268 322 L392 176" fill="none" stroke="url(#lineG)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M330 176 L392 176 L392 238" fill="none" stroke="url(#lineG)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="256" y="452" text-anchor="middle" fill="#eaf8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="86" font-weight="800" letter-spacing="1">TradeMind</text>
</svg>
