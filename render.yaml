# Render Blueprint — click "New + → Blueprint" and point it at this repo.
#
# Honest note: Render's FREE web plan has EPHEMERAL storage, so the SQLite DB
# (accounts, paper trades, alerts) is wiped on every redeploy/restart. Great for
# a public demo; for FREE persistence use the Fly or Oracle Always-Free path in
# DEPLOY.md. (Attaching a Render disk requires a paid instance type.)
services:
  - type: web
    name: trademind
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true          # redeploys on every push to main
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      - key: ALLOW_SIGNUP
        value: "on"           # open registration. Change to "off" for owner-only.
      # Set these two in the Render dashboard (Environment → Secret) — never
      # commit them. Without them no owner account is created and you can't log in:
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Optional email / session extras (SESSION_SECRET, MAIL_PROVIDER, BREVO_API_KEY,
      # MAIL_FROM, SMTP_*) are NOT declared here on purpose: adding new sync:false
      # vars to a live Blueprint can stall the next auto-deploy. Add them by hand in
      # the dashboard — see "Optional — make Forgot password? actually send" in DEPLOY.md.
